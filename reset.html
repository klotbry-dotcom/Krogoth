<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Krogoth Update</title><body style="background:#111923;color:#e9f0f8;font:16px sans-serif;padding:24px"><h2>Updating Krogoth…</h2><p id="status">Clearing outdated offline files.</p><script>
(async()=>{
 const el=document.getElementById('status');
 try{
  if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();for(const reg of regs){if(new URL(reg.scope).pathname.startsWith('/Krogoth/'))await reg.unregister();}}
  if('caches' in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('krogoth-')).map(k=>caches.delete(k)));}
  el.textContent='Cache cleared. Opening latest game…';
 }catch(e){el.textContent='Update attempted: '+e.message+'. Opening game…';}
 location.replace('./index.html?build=455reset'+Date.now());
})();
</script></body></html>
